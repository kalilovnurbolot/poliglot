services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poliglot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: poliglot
    volumes:
      - poliglot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poliglot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.prod
    environment:
      DATABASE_URL: postgres://poliglot:${POSTGRES_PASSWORD}@db:5432/poliglot
      VOICE_SERVICE_URL: ws://voice:2700/
      GRAMMAR_SERVICE_URL: http://grammar:8010
      MEANING_SERVICE_URL: http://meaning:8020
      PRONOUNCE_SERVICE_URL: http://pronounce:8030
      VOICE_SECRET: ${VOICE_SECRET:?set VOICE_SECRET in .env.prod}
      BACKUP_DIR: /backups
    volumes:
      # Shared with the `backup` service: database versions in the admin panel.
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  voice:
    build: ./voice
    environment:
      VOICE_SECRET: ${VOICE_SECRET:?set VOICE_SECRET in .env.prod}
    restart: unless-stopped


  # Grammar check of mission answers (LanguageTool), inside the Docker network only.
  grammar:
    image: erikvl87/languagetool:6.8
    environment:
      Java_Xmx: 1g
    restart: unless-stopped

  # Meaning of mission answers (sentence vectors), inside the Docker network only.
  meaning:
    build: ./meaning
    restart: unless-stopped

  # Pronunciation of mission answers, sound by sound; inside the Docker network only.
  pronounce:
    build: ./pronounce
    restart: unless-stopped

  # Daily database backups into ./backups on the host (scripts/backup.sh, README «Бэкапы»).
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: poliglot
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: poliglot
      BACKUP_HOUR: 3          # UTC
      BACKUP_KEEP_DAYS: 14
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - voice
    restart: unless-stopped

volumes:
  poliglot_db_data:
  caddy_data:
  caddy_config:
