services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poliglot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: poliglot
    volumes:
      - poliglot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poliglot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.prod
    environment:
      DATABASE_URL: postgres://poliglot:${POSTGRES_PASSWORD}@db:5432/poliglot
      VOICE_SERVICE_URL: ws://voice:2700/
      VOICE_SECRET: ${VOICE_SECRET:?set VOICE_SECRET in .env.prod}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  voice:
    build: ./voice
    environment:
      VOICE_SECRET: ${VOICE_SECRET:?set VOICE_SECRET in .env.prod}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - voice
    restart: unless-stopped

volumes:
  poliglot_db_data:
  caddy_data:
  caddy_config:
