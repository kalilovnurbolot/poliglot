services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poliglot
      POSTGRES_PASSWORD: poliglot
      POSTGRES_DB: poliglot
    # ports: бөлүгү өчүрүлдү, ички тармакта гана иштейт
    volumes:
      - poliglot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poliglot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.docker
    environment:
      DATABASE_URL: postgres://poliglot:poliglot@db:5432/poliglot
      # Django reaches the voice service inside the Docker network; browsers never do.
      VOICE_SERVICE_URL: ws://voice:2700/
      BACKUP_DIR: /backups
    volumes:
      # Shared with the `backup` service: database versions in the admin panel.
      - ./backups:/backups
    ports:
      # Сырттан түз кирүүнү жаап, Nginx (же localhost) үчүн гана ачык калтырылды:
      - "127.0.0.1:8018:8000"
    depends_on:
      db:
        condition: service_healthy

  # Speech recognition for voice commands (Vosk). Locally runs without VOICE_SECRET.
  voice:
    build: ./voice
    # ports: бөлүгү өчүрүлдү, ички тармакта гана иштейт

  # Daily database backups into ./backups on the host (scripts/backup.sh, README «Бэкапы»).
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: poliglot
      PGPASSWORD: poliglot
      PGDATABASE: poliglot
      BACKUP_HOUR: 3          # UTC
      BACKUP_KEEP_DAYS: 14
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  poliglot_db_data:
