services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poliglot
      POSTGRES_PASSWORD: poliglot
      POSTGRES_DB: poliglot
    ports:
      - "5432:5432"
    volumes:
      - poliglot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poliglot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.docker
    environment:
      DATABASE_URL: postgres://poliglot:poliglot@db:5432/poliglot
      VOICE_URL: ws://localhost:2700/
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Speech recognition for voice commands (Vosk). Locally runs without VOICE_SECRET.
  voice:
    build: ./voice
    ports:
      - "2700:2700"

volumes:
  poliglot_db_data:
